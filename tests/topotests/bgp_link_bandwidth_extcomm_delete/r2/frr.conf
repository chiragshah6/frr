!
interface lo
 ipv6 address 2001:db8:100::1/128
!
ipv6 route 2001:db8:100::/48 Null0
!
interface r2-eth0
 ipv6 address 2001:db8:23::2/64
!
ipv6 prefix-list TEST-PREFIX seq 5 permit 2001:db8:100::/48
!
route-map TO-R3 permit 10
 match ipv6 address prefix-list TEST-PREFIX
 set extcommunity rt 65001:100
 set extcommunity bandwidth 200
!
router bgp 65001
 bgp router-id 2.2.2.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 2001:db8:23::3 remote-as 4202100001
 neighbor 2001:db8:23::3 timers 1 3
 neighbor 2001:db8:23::3 timers connect 1
 address-family ipv6 unicast
  network 2001:db8:100::/48
  neighbor 2001:db8:23::3 activate
  neighbor 2001:db8:23::3 route-map TO-R3 out
 exit-address-family
!
