!
interface r3-eth0
 ipv6 address 2001:db8:13::3/64
!
interface r3-eth1
 ipv6 address 2001:db8:23::3/64
!
interface r3-eth2
 ipv6 address 2001:db8:34::3/64
!
ip prefix-list PL-V4-PFXLEN-16-24 seq 5 permit 10.0.0.0/8 ge 16 le 24
ipv6 prefix-list PL-V6-PFXLEN-40-56 seq 5 permit 2001:db8:100::/48
!
bgp extcommunity-list expanded stripext seq 15 permit LB:.*:.*
!
route-map DC_RMAP_UNI_OUT permit 10
 match ip address prefix-list PL-V4-PFXLEN-16-24
 set extcommunity bandwidth cumulative
!
route-map DC_RMAP_UNI_OUT permit 15
 match ipv6 address prefix-list PL-V6-PFXLEN-40-56
 set extended-comm-list stripext delete
!
router bgp 4202100001
 bgp router-id 13.0.1.0
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor fabric_sources peer-group
 neighbor fabric_sources remote-as 65001
 neighbor 2001:db8:13::1 peer-group fabric_sources
 neighbor 2001:db8:23::2 peer-group fabric_sources
 neighbor to_dc_peer peer-group
 neighbor to_dc_peer remote-as external
 neighbor 2001:db8:34::4 peer-group to_dc_peer
 address-family ipv6 unicast
  maximum-paths 2
  bgp nhg-per-origin
  neighbor fabric_sources activate
  neighbor to_dc_peer activate
  neighbor to_dc_peer route-map DC_RMAP_UNI_OUT out
 exit-address-family
!
